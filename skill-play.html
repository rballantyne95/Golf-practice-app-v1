<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Game - Golf Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
  <div class="app">
    <button type="button" id="closeBtn" class="close-btn" aria-label="Stop skill game">&times;</button>
    <div class="session-focus-banner" id="clubBanner"></div>
    <div class="set-progress" id="setProgress">SET 1 OF 1</div>
    <div class="set-balls" id="setBalls"></div>
    <div class="set-focus" id="setGame"></div>

    <div id="scoreEntry">
      <div class="section-label">How many did you get?</div>
      <div class="stepper score-stepper">
        <button type="button" id="decScore">&minus;</button>
        <span class="stepper-value" id="scoreValue">0</span>
        <button type="button" id="incScore">+</button>
      </div>
      <div class="score-total" id="scoreTotal"></div>
      <div class="club-grid score-quick-pick" id="scoreQuickPick"></div>
      <button type="button" id="saveScoreBtn" class="primary-button">Save Score</button>
    </div>

    <div id="setComplete" class="hidden">
      <div class="section-label" id="completeLabel">Set complete</div>
      <div class="score-hero"><span class="score-hero-value" id="completeScore"></span></div>
      <button type="button" id="nextSetBtn" class="primary-button">Next Set</button>
    </div>
  </div>

  <script src="storage.js?v=33"></script>
  <script src="skill-play.js?v=33"></script>
</body>
</html>
