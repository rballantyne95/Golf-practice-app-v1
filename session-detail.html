<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Detail - Golf Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1628">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
  <div class="app">
    <a href="index.html" class="back-link">&larr; Back</a>
    <h1>Session Detail</h1>

    <div class="summary-meta">
      <strong id="summaryDate">-</strong>
      <span id="summaryFocus">Focus</span>
      <span id="summaryTotalBalls">0 balls hit</span>
    </div>

    <section>
      <h2>Session Review</h2>
      <div class="review-line" id="summaryCommitment"></div>
      <div class="review-line" id="summaryStrikeQuality"></div>
      <div class="review-line" id="summaryBallFlight"></div>
    </section>

    <section>
      <h2>Sets</h2>
      <ul class="summary-sets" id="summarySets"></ul>
    </section>

    <section>
      <h2>Swing Thoughts</h2>
      <div id="summaryThoughts"></div>
    </section>

    <button type="button" id="repeatSessionBtn" class="primary-button">Repeat This Session</button>
    <a href="#" id="editSessionLink" class="secondary-button">Edit Session</a>
    <button type="button" id="deleteBtn" class="danger-link">Delete Session</button>
  </div>

  <script src="storage.js?v=31"></script>
  <script src="session-detail.js?v=31"></script>
</body>
</html>
