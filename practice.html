<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice - Golf Practice</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div class="app">
    <div class="set-progress" id="setProgress">SET 1 OF 1</div>
    <div class="set-balls" id="setBalls">5 BALLS</div>
    <div class="set-focus" id="setFocus">Focus</div>

    <button type="button" id="completeSetBtn" class="primary-button">Complete Set</button>

    <div id="ratingSection" class="hidden">
      <h2>Rate this set</h2>
      <div class="rating-buttons">
        <button type="button" data-rating="Poor">Poor</button>
        <button type="button" data-rating="OK">OK</button>
        <button type="button" data-rating="Good">Good</button>
      </div>
      <textarea id="setNote" placeholder="Note (optional)"></textarea>
      <button type="button" id="nextSetBtn" class="primary-button" disabled>Next Set</button>
    </div>

    <details class="swing-thoughts">
      <summary>Swing Thoughts (<span id="thoughtCount">0</span>)</summary>
      <ul class="thoughts-list" id="thoughtsList"></ul>
      <div class="add-thought-row">
        <input type="text" id="newThought" placeholder="e.g. Slower takeaway">
        <button type="button" id="addThoughtBtn">+</button>
      </div>
    </details>
  </div>

  <script src="storage.js?v=8"></script>
  <script src="practice.js?v=8"></script>
</body>
</html>
