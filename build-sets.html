<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Sets - Golf Practice</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div class="app">
    <div class="set-progress" id="setProgress">SET 1 OF 3</div>

    <section>
      <h2>Balls in this set</h2>
      <div class="stepper">
        <button type="button" id="decSetBalls">&minus;</button>
        <span class="stepper-value" id="setBallsValue">5</span>
        <button type="button" id="incSetBalls">+</button>
      </div>
      <div class="allocated-tracker" id="remainingHint"></div>
    </section>

    <section>
      <h2>Focus</h2>
      <div id="recentNames" class="chip-row"></div>
      <input type="text" id="focusInput" placeholder="Focus, e.g. Start line">
    </section>

    <button type="button" id="nextSetBtn" class="primary-button" disabled>Next Set</button>
  </div>

  <script src="storage.js?v=7"></script>
  <script src="build-sets.js?v=7"></script>
</body>
</html>
