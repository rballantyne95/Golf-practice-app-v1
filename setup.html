<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Session - Golf Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <div class="app">
    <button type="button" id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
    <h1>New Practice Session</h1>

    <section>
      <h2>What are you working on?</h2>
      <div class="hint-text">Choose up to 3</div>
      <div id="focusAreaPicker" class="club-grid"></div>
      <div class="add-thought-row">
        <input type="text" id="newFocusArea" placeholder="Add your own">
        <button type="button" id="addFocusAreaBtn">+</button>
      </div>
      <div id="focusAreaError" class="field-error hidden">Choose or add a focus for this session</div>
    </section>

    <section>
      <h2>How many balls?</h2>
      <div class="stepper">
        <button type="button" id="decBalls">&minus;</button>
        <span class="stepper-value" id="totalBallsValue">25</span>
        <button type="button" id="incBalls">+</button>
      </div>
      <div class="step-toggle">
        <button type="button" class="step-option selected" data-step="25">25 at a time</button>
        <button type="button" class="step-option" data-step="5">5 at a time</button>
      </div>
    </section>

    <section>
      <h2>How many sets?</h2>
      <div class="stepper">
        <button type="button" id="decSets">&minus;</button>
        <span class="stepper-value" id="numSetsValue">3</span>
        <button type="button" id="incSets">+</button>
      </div>
    </section>

    <button type="button" id="continueBtn" class="primary-button">Continue</button>
  </div>

  <script src="storage.js?v=24"></script>
  <script src="setup.js?v=24"></script>
</body>
</html>
