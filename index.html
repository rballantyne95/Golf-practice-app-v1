<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Practice</title>
<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --bg: #f4f6f4;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --card-bg: #ffffff;
    --border: #e0e0e0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 1.8rem;
    margin: 8px 0 28px;
    text-align: center;
    color: var(--green-dark);
  }

  .start-button {
    display: block;
    width: 100%;
    padding: 22px;
    font-size: 1.3rem;
    font-weight: 600;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
    cursor: pointer;
  }

  .start-button:active {
    background: var(--green-dark);
  }

  section.recent-sessions {
    margin-top: 40px;
  }

  section.recent-sessions h2 {
    font-size: 1.1rem;
    color: var(--text);
    margin-bottom: 12px;
  }

  .empty-state {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Golf Practice</h1>

    <button class="start-button" type="button">Start Practice</button>

    <section class="recent-sessions">
      <h2>Recent Sessions</h2>
      <div class="empty-state">No sessions yet</div>
    </section>
  </div>
</body>
</html>
