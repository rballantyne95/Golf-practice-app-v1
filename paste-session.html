<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create from Text - Golf Practice</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1026">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <div class="app">
    <button type="button" id="closeBtn" class="close-btn" aria-label="Close">&times;</button>
    <h1>Create from Text</h1>

    <section>
      <h2>What are you working on?</h2>
      <div class="hint-text">Choose up to 3</div>
      <div id="focusAreaPicker" class="club-grid"></div>
      <div class="add-thought-row">
        <input type="text" id="newFocusArea" placeholder="Add your own">
        <button type="button" id="addFocusAreaBtn">+</button>
      </div>
    </section>

    <div class="hint-text">
      Paste a session plan, one set per line, e.g. "Balls 1&ndash;20: description" or "20 balls: description".
    </div>

    <textarea id="sessionText" placeholder="Paste your session here&hellip;" rows="12"></textarea>
    <div id="parseError" class="field-error hidden"></div>

    <button type="button" id="parseBtn" class="primary-button">Parse Session</button>
  </div>

  <script src="storage.js?v=28"></script>
  <script src="paste-session.js?v=28"></script>
</body>
</html>
